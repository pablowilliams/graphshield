services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["3000:3000"]
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8080:8080"]
    environment:
      GRAPHSHIELD_API_ADDR: :8080
      GRAPHSHIELD_WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://graphshield:graphshield@postgres:5432/graphshield?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://graphshield:graphshield@postgres:5432/graphshield?sslmode=disable
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphshield-demo-password
      NEO4J_DATABASE: neo4j
      WORKER_ID: worker-compose-01
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graphshield
      POSTGRES_USER: graphshield
      POSTGRES_PASSWORD: graphshield
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphshield -d graphshield"]
      interval: 3s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:2025.06-community
    environment:
      NEO4J_AUTH: neo4j/graphshield-demo-password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  neo4j-data:
