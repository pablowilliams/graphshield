name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: go test -race ./services/... ./datasets/...
      - run: go vet ./services/... ./datasets/...
